name: deploy-site

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::322450712999:role/GitHubActionsDeployRole
          aws-region: us-west-2

      - name: Sync site to S3
        run: |
          aws s3 sync ./ s3://sdotmock.com --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EO35ARSZQHAK3 \
            --paths "/*"
